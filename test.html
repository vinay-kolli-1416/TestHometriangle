<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaterScience Installation Booking</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .logo {
            display: block;
            margin: 20px auto;
            max-width: 200px;
        }
        h1 {
            text-align: center;
            color: #333333;
        }
        form {
            margin-top: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666666;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #4caf50;
            color: #ffffff;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #confirmation {
            margin-top: 20px;
            padding: 20px;
            background-color: #e8f5e9;
            border: 1px solid #4caf50;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.jpg" alt="WaterScience Logo" class="logo">
        <h1>Book Your Installation</h1>
        <form id="bookingForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="contact">Contact Number:</label>
            <input type="tel" id="contact" name="contact" required>

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" required></textarea>

            <input type="hidden" id="product" name="product" value="WaterScience Product">

            <label for="datetime">Preferred Date & Time:</label>
            <input type="datetime-local" id="datetime" name="datetime" required>

            <button type="submit">Submit</button>
        </form>

        <div id="confirmation">
            <h2>Thank you for your booking!</h2>
            <p>We will contact you shortly to confirm your installation.</p>
        </div>
    </div>

    <script>
        var datetimeInput = document.getElementById("datetime");
        var currentDate = new Date();
        var minDate = new Date(currentDate.getTime() + 24 * 60 * 60 * 1000).toISOString().slice(0, 16);
        var maxDate = new Date(currentDate.getTime() + 30 * 24 * 60 * 60 * 1000).toISOString().slice(0, 16);

        datetimeInput.setAttribute("min", minDate);
        datetimeInput.setAttribute("max", maxDate);

        document.getElementById("bookingForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            var name = document.getElementById("name").value;
            var contact = document.getElementById("contact").value;
            var address = document.getElementById("address").value;
            var product = document.getElementById("product").value;
            var datetime = document.getElementById("datetime").value;

            var response = await fetch("https://api.ipify.org?format=json");
            var data = await response.json();
            var ipAddress = data.ip;

            var geocodeResponse = await fetch(`https://ipapi.co/${ipAddress}/json/`);
            var geocodeData = await geocodeResponse.json();
            var city = geocodeData.city;

            var formData = {
                name: name,
                contact: contact,
                address: address,
                product: product,
                datetime: datetime,
                ipAddress: ipAddress,
                city: city
            };

            fetch("https://script.google.com/macros/s/AKfycbw1_BkqDsQTdmfNJNkNkiQ3ZQGqpp00OKQKQK39bhulpglM4orIvBWSHrs4HumCtvBM/exec", {
                method: "POST",
                body: JSON.stringify(formData)
            })
                .then(function() {
                    document.getElementById("bookingForm").style.display = "none";
                    document.getElementById("confirmation").style.display = "block";
                })
                .catch(function(error) {
                    console.error("Error:", error);
                    alert("An error occurred. Please try again later.");
                });
        });
    </script>
</body>
</html>
